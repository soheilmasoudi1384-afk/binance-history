name: binance-history

# Downloads Binance PUBLIC candles on GitHub's servers (outside Iran) and publishes them on the
# `data` branch of THIS repository as one commit (so the repo never grows). Needs no secrets.
on:
  schedule:
    - cron: "17 */6 * * *"      # every 6 hours
  workflow_dispatch: {}          # also runnable by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: binance-history
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # previous data (so each run only downloads what is new); absent on the very first run
      - uses: actions/checkout@v4
        with:
          ref: data
          path: out
        continue-on-error: true

      - name: Download new candles
        run: |
          mkdir -p out
          python3 export_history.py --out out --years 3

      - name: Publish as a single commit on the data branch
        working-directory: out
        run: |
          rm -rf .git
          git init -q -b data
          git config user.name "history-relay"
          git config user.email "history-relay@users.noreply.github.com"
          git add -A
          git commit -q -m "history $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
